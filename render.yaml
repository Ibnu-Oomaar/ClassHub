
services:
  - type: web
    name: classhub-api
    runtime: node
    rootDir: backend
    buildCommand: |
      curl -fsSL https://bun.sh/install | bash
      export PATH="$HOME/.bun/bin:$PATH"
      unset NODE_ENV
      bun install --frozen-lockfile
      bun run build
    startCommand: |
      export PATH="$HOME/.bun/bin:$PATH"
      bun dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
